name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Temporary V0.78 official ETF source integration check
        run: node scripts/update-etf-compositions.mjs
      - name: Temporary V0.78 Nomura API diagnostic
        run: |
          node --input-type=module <<'NODE'
          const base = "https://www.nomurafunds.com.tw/API/ETFAPI/api/";
          const headers = {
            "user-agent": "Mozilla/5.0 PortfolioPilot/0.78",
            "content-type": "application/json",
            "accept": "application/json, text/plain, */*",
            "origin": "https://www.nomurafunds.com.tw",
            "referer": "https://www.nomurafunds.com.tw/ETFWEB/"
          };
          async function probe(path, body) {
            const response = await fetch(base + path, {
              method: "POST",
              headers,
              body: JSON.stringify(body)
            });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { data = null; }
            console.log("PROBE", path, "status", response.status, "bytes", text.length);
            if (!data) {
              console.log("TEXT", text.slice(0, 1000));
              return;
            }
            console.log("TOP_KEYS", Object.keys(data));
            console.log("STATUS_CODE", data.StatusCode);
            console.log("ENTRIES_TYPE", Array.isArray(data.Entries) ? "array" : typeof data.Entries);
            console.log("ENTRIES_KEYS", data.Entries && !Array.isArray(data.Entries) ? Object.keys(data.Entries) : []);
            console.log("SAMPLE", JSON.stringify(data).slice(0, 6000));
          }
          await probe("Fund/GetFundAssets", { FundID: "00935", SearchDate: "" });
          await probe("Fund/GetFundAssets", { FundID: "00935", SearchDate: "2026-09-30" });
          await probe("Fund/GetFundTradeInfoDate", { Type: 1, Keyword: "", FundNo: "00935", Date: "2026-09-30" });
          await probe("Fund/GetFundTradeInfo", { Type: 1, Keyword: "", FundNo: "00935", Date: "2026-09-30" });
          NODE
      - run: npm run build
