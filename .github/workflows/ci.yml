name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Parse TestFlight PowerShell helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/bootstrap-testflight.ps1", [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Audit zero-cost GitHub Actions and standard runners
        run: node scripts/audit-free-github-actions.mjs
      - name: Validate App Store release identity and manual signing safeguards
        run: |
          node scripts/release-preflight.mjs
          node --test scripts/release-preflight.check.mjs
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Test official Strategy Lab OHLCV parser
        run: node --test scripts/lib/strategy-ohlcv.check.mjs
      - name: Check signed WidgetKit provisioning contract
        run: |
          npm run native:ios:widget:signing:test
          node --test scripts/ios-signing-policy.check.mjs
          node --test scripts/ios-manual-signing-contract.check.mjs
          node --test scripts/ios-provisioning-paths.check.mjs
          node --check scripts/prepare-ios-manual-signing.mjs
          node --check scripts/configure-ios-manual-signing.mjs
          node --check scripts/cleanup-ios-manual-signing.mjs
          node --check scripts/verify-ios-signed-widget.mjs
      - run: npm run build
      - run: npm run native:build
