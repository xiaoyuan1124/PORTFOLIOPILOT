name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Temporary V0.78 official ETF source integration check
        run: node scripts/update-etf-compositions.mjs
      - name: Temporary V0.78 Nomura source diagnostic
        run: |
          node --input-type=module <<'NODE'
          const pageUrl = "https://www.nomurafunds.com.tw/ETFWEB/product-description?fundNo=00935&tab=basic";
          const response = await fetch(pageUrl, { headers: { "user-agent": "Mozilla/5.0 PortfolioPilot/0.78", accept: "text/html" } });
          const html = await response.text();
          console.log("page", response.status, html.length);
          const scripts = [...html.matchAll(/<script[^>]*src=["']([^"']+)["']/gi)].map((match) => new URL(match[1], pageUrl).href);
          console.log("scripts", JSON.stringify(scripts));
          for (const scriptUrl of scripts.filter((url) => url.includes("/main."))) {
            const js = await (await fetch(scriptUrl, { headers: { "user-agent": "Mozilla/5.0 PortfolioPilot/0.78" } })).text();
            console.log("main-js-bytes", js.length);
            const hints = [...js.matchAll(/.{0,180}(?:ETFAPI|ETFAPI\/api|fundNo|Shareholding|shareholding|pcf|portfolio|holding).{0,260}/gi)]
              .map((match) => match[0])
              .slice(0, 80);
            console.log("api-hints", JSON.stringify(hints));
          }
          NODE
      - run: npm run build
