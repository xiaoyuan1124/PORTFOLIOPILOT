name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Type UPLOAD to confirm a real App Store Connect upload
        required: true
        type: string
      confirm_bundle_id:
        description: Type com.sy1124.portfoliopilot to confirm the target app
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portfoliopilot-testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: portfolio-testflight
    steps:
      - name: Guard manual production upload
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          CONFIRM_BUNDLE_ID: ${{ inputs.confirm_bundle_id }}
        run: |
          test "$GITHUB_REPOSITORY" = "xiaoyuan1124/PORTFOLIOPILOT"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_UPLOAD" = "UPLOAD"
          test "$CONFIRM_BUNDLE_ID" = "com.sy1124.portfoliopilot"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate required GitHub Secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.PORTFOLIOPILOT_ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.PORTFOLIOPILOT_ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.PORTFOLIOPILOT_ASC_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.PORTFOLIOPILOT_IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          for key in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64 IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            if [ -z "${!key}" ]; then
              echo "::error::Required signing secret $key is not configured in portfolio-testflight"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.PORTFOLIOPILOT_ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.PORTFOLIOPILOT_ASC_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APP_STORE_CONNECT_API_KEY_P8_BASE64, "base64"))' "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate and verify iOS shell
        run: npm run native:ios:add

      - name: Install and verify manual Apple Distribution signing assets
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.PORTFOLIOPILOT_IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.PORTFOLIOPILOT_IOS_WIDGET_PROFILE_BASE64 }}
        run: node scripts/prepare-ios-manual-signing.mjs

      - name: Configure Release App and WidgetKit manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
        run: node scripts/configure-ios-manual-signing.mjs

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Create TestFlight export options
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
          EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ExportOptions-TestFlight.plist
        run: |
          npm run native:ios:testflight:options
          plutil -lint "$EXPORT_OPTIONS_PATH"
          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH" >> "$GITHUB_ENV"

      - name: Build signed App Store archive
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.PORTFOLIOPILOT_ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.PORTFOLIOPILOT_ASC_ISSUER_ID }}
          ARCHIVE_PATH: ${{ runner.temp }}/PortfolioPilot-signed.xcarchive
        run: |
          npm run native:ios:archive:signed
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify signed archive identity
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PortfolioPilot-signed.xcarchive
        run: |
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")" = "com.sy1124.portfoliopilot"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist")" = "$(node -p "require('./native/app-store.json').version")"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/Info.plist")" = "$(node -p "require('./native/app-store.json').buildNumber")"
          test -f "$APP_PATH/PlugIns/PortfolioPilotWidgets.appex/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/PlugIns/PortfolioPilotWidgets.appex/Info.plist")" = "com.sy1124.portfoliopilot.widgets"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APP_PATH/PlugIns/PortfolioPilotWidgets.appex/Info.plist")" = "com.apple.widgetkit-extension"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "Authority="

      - name: Verify Apple-signed App Groups profiles for host and widget
        env:
          APPLE_TEAM_ID: ${{ secrets.PORTFOLIOPILOT_APPLE_TEAM_ID }}
          ARCHIVE_PATH: ${{ runner.temp }}/PortfolioPilot-signed.xcarchive
        run: npm run native:ios:widget:signed:verify

      - name: Upload exact archive to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.PORTFOLIOPILOT_ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.PORTFOLIOPILOT_ASC_ISSUER_ID }}
          EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ExportOptions-TestFlight.plist
          ARCHIVE_PATH: ${{ runner.temp }}/PortfolioPilot-signed.xcarchive
          EXPORT_PATH: ${{ runner.temp }}/testflight-export
        run: npm run native:ios:testflight:upload

      - name: Report uploaded identity
        run: |
          echo "Uploaded PortfolioPilot $(node -p "require('./native/app-store.json').version") ($(node -p "require('./native/app-store.json').buildNumber")) from commit $GITHUB_SHA"

      - name: Remove temporary private signing assets
        if: always()
        run: |
          if [ -f scripts/cleanup-ios-manual-signing.mjs ]; then
            node scripts/cleanup-ios-manual-signing.mjs
          fi
