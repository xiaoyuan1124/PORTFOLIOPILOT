name: Refresh Taiwan Closing Quotes

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-quotes.mjs"
      - "scripts/lib/quote-data.mjs"
      - ".github/workflows/quotes.yml"
  schedule:
    # Taiwan time: 13:40, 13:50, 14:00, 14:15, 14:30, 15:00,
    # then 17:00, 19:00 and 21:00 as delayed-publication fallbacks.
    # Early retries make the same-day official close available much sooner
    # without publishing incomplete data when an exchange endpoint lags.
    - cron: "40,50 5 * * 1-5"
    - cron: "0,15,30 6 * * 1-5"
    - cron: "0 7,9,11,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-market-data-writers
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    outputs:
      quotes_changed: ${{ steps.quote_commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch latest official TWSE / TPEx closing quotes
        run: node scripts/update-quotes.mjs
      - name: Commit newer quote cache
        id: quote_commit
        run: |
          if git diff --quiet -- public/data/tw-quotes.json; then
            echo "No quote changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/tw-quotes.json
            git commit -m "data: refresh Taiwan closing quotes"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.quote_commit.outputs.changed == 'true'
        run: npm install --legacy-peer-deps
      - name: Build site with refreshed closing quotes
        if: steps.quote_commit.outputs.changed == 'true'
        run: npm run build
      - uses: actions/configure-pages@v6
        if: steps.quote_commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.quote_commit.outputs.changed == 'true'
        with:
          path: ./out

  deploy:
    if: needs.refresh-and-build.outputs.quotes_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed closing quotes
        id: deployment
        uses: actions/deploy-pages@v5
