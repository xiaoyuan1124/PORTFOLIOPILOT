name: Refresh Taiwan Closing Quotes

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-quotes.mjs"
      - "scripts/lib/quote-data.mjs"
      - ".github/workflows/quotes.yml"
  schedule:
    # Taiwan time: 15:17, 17:17, 19:17, 21:17 on weekdays.
    # Multiple attempts reduce dependence on a single delayed GitHub cron run
    # and allow the exchange endpoints time to publish final close data.
    - cron: "17 7,9,11,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-market-data-writers
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch latest official TWSE / TPEx closing quotes
        run: node scripts/update-quotes.mjs
      - name: Commit newer quote cache
        run: |
          if git diff --quiet -- public/data/tw-quotes.json; then
            echo "No quote changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/tw-quotes.json
            git commit -m "data: refresh Taiwan closing quotes"
            git push
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build site with refreshed closing quotes
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed closing quotes
        id: deployment
        uses: actions/deploy-pages@v5
