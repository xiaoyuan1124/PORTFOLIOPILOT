name: Refresh Taiwan Market Data

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-market-data.mjs"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-pages
  cancel-in-progress: true

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch official TWSE and TPEx market data
        run: node scripts/update-market-data.mjs
      - name: Commit changed caches
        run: |
          if git diff --quiet -- public/data/tw-quotes.json public/data/tw-revenue.json; then
            echo "No market data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/tw-quotes.json public/data/tw-revenue.json
            git commit -m "data: refresh Taiwan market data"
            git push
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build site with refreshed caches
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed market caches
        id: deployment
        uses: actions/deploy-pages@v4
