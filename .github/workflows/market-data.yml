name: Refresh Taiwan Market Data

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-market-data.mjs"
      - "scripts/update-etf-compositions.mjs"
      - "scripts/lib/etf-composition-data.mjs"
      - "scripts/lib/etf-composition-history.mjs"
      - "scripts/update-material-events.mjs"
      - "scripts/lib/material-events.mjs"
      - "scripts/lib/valuation-data.mjs"
      - "scripts/update-quarterly-financials.mjs"
      - "scripts/lib/quarterly-financials.mjs"
      - "scripts/update-benchmarks.mjs"
      - "scripts/lib/benchmark-data.mjs"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-market-data-writers
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch official TWSE / TPEx / MOPS market data
        run: node scripts/update-market-data.mjs
      - name: Refresh official issuer ETF compositions
        run: node scripts/update-etf-compositions.mjs
      - name: Fetch official MOPS / TWSE / TPEx material events
        run: node scripts/update-material-events.mjs
      - name: Fetch official MOPS quarterly financials
        id: quarterly
        continue-on-error: true
        run: timeout 240s node scripts/update-quarterly-financials.mjs
      - name: Report quarterly cache fallback
        if: steps.quarterly.outcome == 'failure'
        run: |
          echo "::warning::MOPS quarterly refresh failed after retries. Keeping the previously committed quarterly-margin cache so successful quote, revenue, material-event and benchmark refreshes can still be published."
          {
            echo "### Quarterly financial cache fallback"
            echo ""
            echo "MOPS quarterly refresh failed after retries. The workflow will preserve the previously committed `public/data/tw-quarterly-margins.json` cache and continue publishing other official-data updates."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch official TWSE benchmark history
        run: node scripts/update-benchmarks.mjs
      - name: Commit changed caches
        run: |
          if git diff --quiet -- public/data/tw-quotes.json public/data/tw-revenue.json public/data/tw-valuations.json public/data/tw-revenue-history.json public/data/tw-institutional-10d.json public/data/tw-material-events.json public/data/tw-quarterly-margins.json public/data/tw-benchmarks.json public/data/tw-etf-compositions.json; then
            echo "No market data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/tw-quotes.json public/data/tw-revenue.json public/data/tw-valuations.json public/data/tw-revenue-history.json public/data/tw-institutional-10d.json public/data/tw-material-events.json public/data/tw-quarterly-margins.json public/data/tw-benchmarks.json public/data/tw-etf-compositions.json
            git commit -m "data: refresh Taiwan market data"
            git push
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build site with refreshed caches
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed market caches
        id: deployment
        uses: actions/deploy-pages@v4
