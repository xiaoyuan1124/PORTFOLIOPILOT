name: Refresh Taiwan Price History

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-price-history.mjs"
      - "scripts/lib/price-history.mjs"
      - "scripts/lib/quote-data.mjs"
      - ".github/workflows/price-history.yml"
  schedule:
    # Taiwan time: 23:47 and 01:47 (next day) on weekdays.
    # Run after the final closing-quote attempt; the second slot is a delayed-cron fallback.
    # The updater exits early when history already matches tw-quotes, avoiding cache churn.
    - cron: "47 15,17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-market-data-writers
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backfill official TWSE / TPEx daily closes
        run: node scripts/update-price-history.mjs
      - name: Commit changed price-history caches
        run: |
          git add public/data/tw-price-history
          if git diff --cached --quiet; then
            echo "No price-history changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh Taiwan price history"
            git push
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build site with refreshed price history
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy refreshed price history
        id: deployment
        uses: actions/deploy-pages@v4
